<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAWDIF - إنشاء حساب جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
/* ==========================================================================
   Animations & Professional Glow Effects
   ========================================================================== */

@keyframes smoothEntrance {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
}

.top-nav { animation: smoothEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.auth-container { animation: smoothEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; opacity: 0; }
.site-footer { animation: smoothEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; }

@keyframes textNeonPulse {
    0%, 100% { color: var(--neon-glow); text-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
    50% { color: #ffffff; text-shadow: 0 0 18px rgba(192, 132, 252, 0.9), 0 0 32px rgba(168, 85, 247, 0.7); }
}

.welcome-title span { display: inline-block; animation: textNeonPulse 3s ease-in-out infinite; cursor: default; }

@keyframes cardNeonBorderGlow {
    0%, 100% { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
    50% { border-color: rgba(192, 132, 252, 0.9); box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 35px rgba(168, 85, 247, 0.6); }
}

.login-card {
    position: relative;
    animation: cardNeonBorderGlow 4s ease-in-out infinite;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.login-card:hover {
    transform: translateY(-6px) scale(1.01);
    border-color: #c084fc;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(168, 85, 247, 0.7);
}

/* ==========================================================================
   Custom Modal & Animations (البطاقات الزجاجية المنبثقة)
   ========================================================================== */
@keyframes modalPopUp {
    0% { opacity: 0; transform: scale(0.8) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes iconBounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.1); }
    60% { transform: translateY(-5px) scale(1.05); }
}

.custom-modal-card {
    background: rgba(13, 9, 23, 0.95);
    padding: 35px 30px;
    border-radius: 20px;
    text-align: center;
    animation: modalPopUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    max-width: 340px;
    width: 90%;
    backdrop-filter: blur(12px);
}

.success-card {
    border: 1.5px solid rgba(16, 185, 129, 0.5);
    box-shadow: 0 0 50px rgba(16, 185, 129, 0.25), inset 0 0 15px rgba(16, 185, 129, 0.15);
}

.error-card {
    border: 1.5px solid rgba(239, 68, 68, 0.5);
    box-shadow: 0 0 50px rgba(239, 68, 68, 0.25), inset 0 0 15px rgba(239, 68, 68, 0.15);
}

.modal-icon-success {
    font-size: 50px;
    color: #10B981;
    margin-bottom: 15px;
    animation: iconBounce 1s ease infinite;
    filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.6));
}

.modal-icon-error {
    font-size: 50px;
    color: #EF4444;
    margin-bottom: 15px;
    animation: iconBounce 1s ease infinite;
    filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6));
}

.modal-btn {
    margin-top: 20px;
    padding: 8px 25px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    transition: all 0.3s;
}
.modal-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.4); }

:root {
    --bg-dark: #05030a;
    --card-bg: rgba(13, 9, 23, 0.78);
    --neon-glow: #c084fc;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-glass: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

body, .auth-body {
    background-color: var(--bg-dark);
    background: radial-gradient(circle at 50% 30%, #1a0b36 0%, #05030a 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    direction: rtl;
    overflow-x: hidden;
    position: relative;
}

.top-nav {
    width: 100%;
    max-width: 1400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    z-index: 10;
}

.nav-brand { display: flex; align-items: center; gap: 15px; text-decoration: none; }
.nav-logo { width: 135px; height: 135px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.9)); }
.nav-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-ar { font-size: 15px; font-weight: 700; color: #fff; }
.brand-en { font-size: 9px; color: var(--neon-glow); font-weight: 600; letter-spacing: 0.8px; }

.nav-links { display: flex; gap: 30px; list-style: none; align-items: center; }
.nav-links a { color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 600; transition: color 0.3s; }
.nav-links a:hover, .nav-links a.active { color: var(--neon-glow); text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }

.auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 20px; flex: 1; width: 100%; z-index: 1; }
.welcome-header { text-align: center; margin-bottom: 12px; }
.welcome-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.welcome-title span { color: var(--neon-glow); }
.welcome-desc { font-size: 11px; color: var(--text-muted); }

.login-card {
    width: 100%;
    max-width: 370px;
    padding: 20px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1.5px solid var(--border-glass);
    border-radius: 18px;
    overflow: hidden;
}

.card-logo-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
.card-logo-img { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(168, 85, 247, 1)); }
.card-subtext { font-size: 10px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }

.input-group { position: relative; margin-bottom: 10px; }
.input-group input {
    width: 100%;
    padding: 8px 36px;
    background: rgba(10, 5, 18, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    outline: none;
    transition: all 0.3s;
}
.input-group input:focus { border-color: var(--neon-glow); box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

.input-group i.field-icon { 
    position: absolute; 
    right: 12px; 
    top: 50%; 
    transform: translateY(-50%); 
    color: var(--text-muted); 
    font-size: 12px; 
}

.toggle-password {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    transition: color 0.3s;
}
.toggle-password:hover { color: var(--neon-glow); }

.submit-btn {
    width: 100%;
    padding: 9px;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
    transition: all 0.3s;
}
.submit-btn:hover { background: linear-gradient(135deg, #a855f7, #5b21b6); transform: translateY(-2px); }

.divider { text-align: center; margin: 10px 0; position: relative; }
.divider span { background: #0d0917; padding: 0 8px; color: var(--text-muted); font-size: 10px; position: relative; z-index: 1; }
.divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255, 255, 255, 0.1); }

.btn-secondary {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    padding: 9px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.3s;
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(168, 85, 247, 0.4); }

.site-footer { text-align: center; padding: 12px; font-size: 11px; color: var(--text-muted); width: 100%; z-index: 1; }
.footer-links { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 6px; }
.footer-links a { color: var(--text-muted); text-decoration: none; }
.footer-socials { display: flex; gap: 15px; justify-content: center; margin-top: 6px; }
.footer-socials a { color: var(--text-muted); font-size: 12px; }
.copyright span { color: var(--neon-glow); }
    </style>
</head>
<body class="auth-body">

    <!-- الشريط العلوي -->
    <header class="top-nav">
        <a href="index.html" class="nav-brand">
            <img src="111-removebg-preview (1).png" alt="TAWDIF Logo" class="nav-logo">
            <div class="nav-brand-text">
                <span class="brand-ar">توظيف</span>
                <span class="brand-en">TAWDIF</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="login.html">تسجيل الدخول</a></li>
            <li><a href="register.html" class="active">إنشاء حساب</a></li>
        </ul>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="auth-container">
        <div class="welcome-header">
            <h1 class="welcome-title">انضم إلينا في <span>توظيف</span></h1>
            <p class="welcome-desc">أنشئ حسابك وابدأ رحلتك المهنية الآن</p>
        </div>

        <div class="login-card">
            <div class="card-logo-wrapper">
                <img src="111-removebg-preview (1).png" alt="شعار توظيف" class="card-logo-img" onerror="this.src='https://via.placeholder.com/75?text=Logo'">
            </div>
            
            <p class="card-subtext">سجل بياناتك لتستفيد من أفضل الفرص المتاحة</p>

            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="registerUsername" placeholder="اسم المستخدم (Username)" required>
                    <i class="fa-regular fa-user field-icon"></i>
                </div>

                <div class="input-group">
                    <input type="text" id="regIdentifier" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    <i class="fa-regular fa-envelope field-icon"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                    <i class="fa-solid fa-eye toggle-password" id="toggleRegPassword"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة المرور" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                    <i class="fa-solid fa-eye toggle-password" id="toggleRegConfirmPassword"></i>
                </div>

                <button type="submit" class="submit-btn" style="margin-top: 4px; margin-bottom: 10px;">إنشاء الحساب</button>
                
                <div class="divider"><span>أو</span></div>

                <a href="login.html" class="btn-secondary" style="margin-top: 10px;">لديك حساب بالفعل؟ تسجيل الدخول</a>
            </form>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="site-footer">
        <div class="footer-content">
            <p class="copyright">جميع الحقوق محفوظة &copy; 2026 <span>TAWDIF</span>.</p>
            <div class="footer-links">
                <a href="#">سياسة الخصوصية</a>
                <span>•</span>
                <a href="#">شروط الاستخدام</a>
                <span>•</span>
                <a href="#">الدعم المباشر</a>
            </div>
            <div class="footer-socials">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <!-- سكربت التسجيل وحفظ اسم المستخدم -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleRegPassword = document.getElementById('toggleRegPassword');
            const regPasswordInput = document.getElementById('regPassword');
            if (toggleRegPassword && regPasswordInput) {
                toggleRegPassword.addEventListener('click', function() {
                    const type = regPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    regPasswordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            const toggleRegConfirmPassword = document.getElementById('toggleRegConfirmPassword');
            const regConfirmPasswordInput = document.getElementById('regConfirmPassword');
            if (toggleRegConfirmPassword && regConfirmPasswordInput) {
                toggleRegConfirmPassword.addEventListener('click', function() {
                    const type = regConfirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    regConfirmPasswordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            const modalOverlay = document.createElement('div');
            modalOverlay.style.cssText = 'display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,3,10,0.85); backdrop-filter:blur(8px); z-index:9999; justify-content:center; align-items:center;';
            document.body.appendChild(modalOverlay);

            function showModal(type, title, desc, callback) {
                const isSuccess = type === 'success';
                modalOverlay.innerHTML = `
                    <div class="custom-modal-card ${isSuccess ? 'success-card' : 'error-card'}">
                        <div class="${isSuccess ? 'modal-icon-success' : 'modal-icon-error'}">
                            <i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>
                        </div>
                        <h2 style="color:#fff; font-size:18px; margin-bottom:6px;">${title}</h2>
                        <p style="color:#94a3b8; font-size:12px; margin-bottom:15px;">${desc}</p>
                        <button type="button" class="modal-btn" id="modalCloseBtn">حسناً</button>
                    </div>
                `;
                modalOverlay.style.display = 'flex';

                const closeModal = (e) => {
                    if (e) e.preventDefault();
                    modalOverlay.style.display = 'none';
                    if (callback) callback();
                };

                const closeBtn = document.getElementById('modalCloseBtn');
                if (closeBtn) {
                    closeBtn.onclick = closeModal;
                }

                modalOverlay.onclick = (e) => { 
                    if (e.target === modalOverlay) closeModal(e); 
                };

                if (isSuccess) {
                    setTimeout(() => {
                        if (modalOverlay.style.display === 'flex') {
                            modalOverlay.style.display = 'none';
                            if (callback) callback();
                        }
                    }, 1500);
                }
            }

            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    var username = document.getElementById('registerUsername').value.trim();
                    var identifier = document.getElementById('regIdentifier').value.trim();
                    var password = regPasswordInput.value;
                    var confirmPassword = regConfirmPasswordInput.value;

                    if (password !== confirmPassword) {
                        showModal('error', 'خطأ في التطابق', 'كلمتا المرور غير متطابقتين!');
                        return;
                    }

                    var users = JSON.parse(localStorage.getItem('tawdif_users')) || [];
                    
                    var existingUser = users.find(function(u) {
                        return u.identifier === identifier;
                    });

                    if (existingUser) {
                        showModal('error', 'الحساب موجود', 'هذا البريد أو رقم الهاتف مسجل مسبقاً!');
                    } else {
                        // حفظ بيانات المستخدم متضمنة اسم المستخدم لكي يظهر في الترحيب لاحقاً
                        users.push({ username: username, identifier: identifier, password: password });
                        localStorage.setItem('tawdif_users', JSON.stringify(users));
                        
                        showModal('success', 'تم إنشاء الحساب بنجاح!', 'جاري تحويلك لتسجيل الدخول...', () => {
                            window.location.href = 'login.html';
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
